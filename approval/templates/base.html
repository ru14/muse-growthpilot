<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}GrowthPilot approval{% endblock %}</title>
<style>
  :root {
    --bg: #faf7f2; --card: #ffffff; --ink: #2b2420; --muted: #6f655d; --line: #e6ddd2;
    --brand: #7a1f2b; --ok: #2f6b3a; --ok-bg: #e8f3ea; --bad: #a3271f; --bad-bg: #fbe9e7;
    --wait: #8a5a00; --wait-bg: #fdf3dc;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
         font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans Devanagari", sans-serif; }
  header { background: var(--brand); color: #fff; padding: 14px 24px; }
  header a { color: #fff; text-decoration: none; font-weight: 600; }
  header span { opacity: .8; margin-left: 8px; }
  main { max-width: 1100px; margin: 0 auto; padding: 24px 16px 64px; }
  h1 { font-size: 24px; margin: 0 0 4px; }
  h2 { font-size: 18px; margin: 32px 0 12px; }
  .muted { color: var(--muted); }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 16px; }
  .badge { display: inline-block; padding: 2px 10px; border-radius: 99px; font-size: 13px; font-weight: 600; }
  .awaiting_owner_approval { background: var(--wait-bg); color: var(--wait); }
  .approved, .passed { background: var(--ok-bg); color: var(--ok); }
  .rejected, .needs_owner_input, .failed { background: var(--bad-bg); color: var(--bad); }
  .flash { padding: 10px 14px; border-radius: 8px; margin-bottom: 16px; }
  .flash.ok { background: var(--ok-bg); color: var(--ok); }
  .flash.error { background: var(--bad-bg); color: var(--bad); }
  table { width: 100%; border-collapse: collapse; background: var(--card); }
  th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { font-size: 13px; color: var(--muted); font-weight: 600; }
  a { color: var(--brand); }
  pre { white-space: pre-wrap; margin: 0; font: inherit; }
  button { font: inherit; padding: 8px 16px; border-radius: 8px; border: 1px solid var(--brand);
           background: var(--brand); color: #fff; cursor: pointer; }
  button.secondary { background: #fff; color: var(--brand); }
  button:disabled { opacity: .4; cursor: not-allowed; }
  input[type=text], textarea { font: inherit; width: 100%; padding: 8px; border: 1px solid var(--line); border-radius: 8px; }
  .grid { display: grid; gap: 16px; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); }
  .choice { display: block; cursor: pointer; }
  .choice input { margin-right: 6px; }
  .choice img { width: 100%; border-radius: 8px; border: 1px solid var(--line); display: block; margin-top: 8px; }
  .choice.disabled { opacity: .5; cursor: not-allowed; }
  .posts { display: grid; gap: 12px; grid-template-columns: 1fr 1fr; margin-top: 8px; }
  .posts .card { background: var(--bg); }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .steps li { margin-bottom: 10px; }
  @media (max-width: 700px) { .posts { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<header><a href="{{ url_for('index') }}">GrowthPilot approval</a><span>{{ business.name }}</span></header>
<main>
  {% for kind, message in get_flashed_messages(with_categories=true) %}
    <div class="flash {{ kind }}">{{ message }}</div>
  {% endfor %}
  {% block content %}{% endblock %}
</main>
</body>
</html>
